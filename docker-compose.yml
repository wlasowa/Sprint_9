services:

  selenoid:
    image: "aerokube/selenoid"
    container_name: selenoid
    ports:
      - "4444:4444"
    networks:
      - selenoid
    volumes:
      - "./browser.json:/etc/selenoid/browser.json"
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      - DOCKER_API_VERSION=1.40
    command: ["-conf", "/etc/selenoid/browser.json", "-container-network", "selenoid"]

  selenoid-ui:
    image: "aerokube/selenoid-ui:latest"
    container_name: selenoid-ui
    links:
      - selenoid
    ports:
      - "8081:8080"
    networks:
      - selenoid
    command: ["--selenoid-uri", "http://selenoid:4444"]

  test_docker:
    build: .
    container_name: test_docker
    depends_on:
      - selenoid
    networks:
      - selenoid
    environment:
      SELENOID_URL: http://selenoid:4444/wd/hub
    tty: true
    command: ["pytest"]

networks:
  selenoid:
    name: selenoid